<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;background:#101018;color:white;font:14px Arial,sans-serif;padding:7px;--rgb:#00e5ff}header{display:flex;justify-content:space-between;align-items:center;margin:2px 3px 8px;font-weight:bold}button{color:#fff;border:1px solid #414252;background:linear-gradient(145deg,#282936,#171820);border-radius:7px;min-height:42px;box-shadow:0 0 7px color-mix(in srgb,var(--rgb),transparent 45%);font-size:14px;touch-action:manipulation}.controls button{min-height:30px;padding:4px 8px;margin-left:4px}.rows{display:flex;flex-direction:column;gap:5px}.row{display:flex;justify-content:center;gap:4px}.key{flex:1;min-width:0;padding:0 1px}.wide{flex:1.5}.space{flex:5}.accent{border-color:var(--rgb);box-shadow:0 0 10px color-mix(in srgb,var(--rgb),transparent 25%)}footer{font-size:11px;text-align:center;color:#a7a8b8;margin-top:7px}
</style></head><body><header><span>✦ RGB GAMING</span><span class="controls"><button onclick="cycle()">RGB ✨</button><button onclick="toggle()">Glow</button></span></header><div class="rows" id="keys"></div><footer>Tap RGB to change lighting • Local keyboard input</footer><script>
const rows=['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'];let caps=false;const host=document.getElementById('keys');function addRow(chars,cls=''){let r=document.createElement('div');r.className='row';[...chars].forEach(ch=>{let b=document.createElement('button');b.className='key '+cls;b.textContent=caps?ch.toUpperCase():ch;b.onclick=()=>{if(ch==='⌫')AndroidKeyboard.backspace();else if(ch==='↵')AndroidKeyboard.enter();else if(ch==='⇧'){caps=!caps;draw()}else AndroidKeyboard.commitText(ch==='␠'?' ':b.textContent)};r.appendChild(b)});host.appendChild(r)}function draw(){host.innerHTML='';addRow(rows[0]);addRow(rows[1]);addRow(rows[2]);let r=document.createElement('div');r.className='row';['⇧',...rows[3],'⌫'].forEach(ch=>{let b=document.createElement('button');b.className='key '+(['⇧','⌫'].includes(ch)?'wide accent':'');b.textContent=caps?ch.toUpperCase():ch;b.onclick=()=>{if(ch==='⌫')AndroidKeyboard.backspace();else if(ch==='⇧'){caps=!caps;draw()}else AndroidKeyboard.commitText(b.textContent)};r.appendChild(b)});host.appendChild(r);let last=document.createElement('div');last.className='row';[['?123',()=>{}],[',',()=>AndroidKeyboard.commitText(',')],['␠',()=>AndroidKeyboard.commitText(' ')],['.',()=>AndroidKeyboard.commitText('.')],['↵',()=>AndroidKeyboard.enter()]].forEach(([t,f])=>{let b=document.createElement('button');b.className='key '+(t==='␠'?'space':'wide');b.textContent=t;b.onclick=f;last.appendChild(b)});host.appendChild(last)}let hues=[185,285,330,25,115,220];let hi=0;function cycle(){hi=(hi+1)%hues.length;document.body.style.setProperty('--rgb',`hsl(${hues[hi]} 100% 60%)`)}function toggle(){document.body.style.setProperty('--rgb',document.body.style.getPropertyValue('--rgb')?'#343444':'#00e5ff')}draw();
</script></body></html>
