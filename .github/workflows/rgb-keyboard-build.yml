name: Build RGB Keyboard APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'RGBKeyboardAndroid/**'
      - '.github/workflows/rgb-keyboard-build.yml'
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source and build debug APK
        working-directory: RGBKeyboardAndroid
        run: |
          test -f app/src/main/assets/keyboard.html
          test -f app/src/main/AndroidManifest.xml
          gradle --no-daemon clean assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RGB-Keyboard-Premium-debug-apk
          path: RGBKeyboardAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
